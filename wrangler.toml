# Bands for Days on Cloudflare (Worker name "bandsix" is kept; renaming it would break the deploy): the site is served as Workers static assets.
# The 611 resource PDFs live in the R2 bucket "bandsix-files", served at files.bandsfordays.com.
# worker.js answers /api/* (free AI marking); everything else is a static file.
name = "bandsix"
main = "worker.js"
compatibility_date = "2026-10-01"
routes = [
  { pattern = "bandsfordays.com", custom_domain = true },
  { pattern = "www.bandsfordays.com", custom_domain = true }
]

[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Daily marking counts per student and site-wide (keys expire after 2 days).
[[kv_namespaces]]
binding = "MARKS"
id = "c669400708c643d0b421cb6ec5ffb401"

# Plans (phase C). Billing stays OFF until the secrets STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET are set
# (wrangler secret put ... --name bandsix) and STRIPE_PRICE_ID below is the Plus price id (price_...). See OPERATIONS.md "Billing".
# PLUS_MONTHLY marks per billing period for Plus; DAILY_LIMIT a day stays the Free allowance (blueprint 15: never cut quietly).
# Public settings. The Supabase key here is the publishable one (same as in app.html).
# The Anthropic key is a secret: wrangler secret put ANTHROPIC_API_KEY
[vars]
SUPA_URL = "https://vfrrzrkiamsnyesqevwl.supabase.co"
SUPA_KEY = "sb_publishable_NbyHQeXmH1ovRyHYOmFMXA_OEub4F2z"
DAILY_LIMIT = "5"
GLOBAL_DAILY_CAP = "300"
MODEL = "claude-opus-5-5"
PLUS_MONTHLY = "100"
PLUS_PRICE_TEXT = "A$9.99 a month"
STRIPE_PRICE_ID = "price_1UWTtwQS6LNTxwec97sJZFh0"

# Preview URLs (<version>-bandsix.<account>.workers.dev) so every PR build gets a link in the PR comment.
preview_urls = true

# PR branches deploy with `wrangler preview`, which requires this block (it can stay empty).
[previews]

